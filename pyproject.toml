[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stillworks"
version = "0.1.3"
description = "Take a snapshot of what your code does, then see if your edit moved anything. For code with no tests. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "stillworks contributors" }]
keywords = [
  "testing", "characterization-tests", "golden-tests", "regression",
  "ai-generated-code", "verification", "refactoring", "mcp", "coding-agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
# The rest of the family.  They stay separate distributions — independent
# versions, and `pip install stillworks` keeps its zero-dependency promise —
# but nobody should have to memorise two suffixed PyPI names, so
# `pip install 'stillworks[all]'` hides them here.
# The floors are the first release of each that reports its own version
# correctly.  unedit 0.1.4 and agentdiff-cli 0.1.3 shipped with the version
# fixed in the source and an older build inside the wheel, so `--version` lied;
# the fix could not go out under those numbers because PyPI filenames cannot be
# replaced.  Anyone installing the family should not land on one of them.
all = [
  "unedit>=0.1.5",
  "agentdiff-cli>=0.1.4",
  "agentlog-tool>=0.2.3",
  "agentwatch>=0.1.0",
]

[project.scripts]
stillworks = "stillworks.cli:main"

[project.urls]
Homepage = "https://github.com/iselur/stillworks"

[tool.setuptools]
packages = ["stillworks"]
