[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stillworks"
version = "0.2.1"
description = "Five small tools for working with coding agents: snapshot your code's behavior, undo agent edits, review agent diffs, read agent logs, watch an agent live. One install, zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "stillworks contributors" }]
keywords = [
  "testing", "characterization-tests", "golden-tests", "regression",
  "ai-generated-code", "verification", "refactoring", "mcp", "coding-agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
# Since 0.2.0 the whole family ships in this one distribution, so the extra is
# empty.  It stays because `pip install 'stillworks[all]'` was the documented
# install command for 0.1.x — that command must keep working, and must never
# again resolve to an older release the way it did while the extra pinned a
# distribution that did not exist yet.
all = []

[project.scripts]
stillworks = "stillworks.cli:main"
unedit = "unedit.cli:main"
agentdiff = "agentdiff.cli:main"
agentlog = "agentlog.cli:main"
agentwatch = "agentwatch.cli:main"

[project.urls]
Homepage = "https://github.com/iselur/stillworks"

[tool.setuptools]
packages = ["stillworks", "unedit", "agentdiff", "agentlog", "agentwatch"]
