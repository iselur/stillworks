[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stillworks"
version = "0.1.0"
description = "Record what your code does now, catch when it changes later — behavior lock for AI-edited and legacy code. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "stillworks contributors" }]
keywords = [
  "testing", "characterization-tests", "golden-tests", "regression",
  "ai-generated-code", "verification", "refactoring", "mcp", "coding-agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
stillworks = "stillworks.cli:main"

[project.urls]
# NOTE: github.com/stillworks is an unrelated existing org — publish under
# your own account or an available org (e.g. stillworks-py) and update this.
Homepage = "https://github.com/stillworks-py/stillworks"

[tool.setuptools]
packages = ["stillworks"]
